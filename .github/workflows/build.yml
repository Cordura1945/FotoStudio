name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: App-Symbol vorbereiten
        run: |
          if [ -f AppIcon.png ]; then
            mkdir -p Assets.xcassets/AppIcon.appiconset
            sips -z 1024 1024 AppIcon.png --out Assets.xcassets/AppIcon.appiconset/icon.png
            printf '%s' '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
            printf '%s' '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
            echo "App-Symbol eingebunden"
          else
            echo "Kein AppIcon.png gefunden - ohne Symbol bauen"
          fi

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert)
        run: |
          set +e
          xcodebuild -project FotoStudio.xcodeproj \
            -scheme FotoStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          echo "===== FEHLER ====="
          grep -E "error:" build.log | sort -u | head -40
          echo "===== ENDE ====="
          exit $code

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FotoStudio.app Payload/
          zip -r FotoStudio.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FotoStudio-ipa
          path: FotoStudio.ipa
