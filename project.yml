name: FotoStudio
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  FotoStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        optional: true
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photoshop-Dokument
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.photoshop-image
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fotostudio.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FotoStudio
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FotoStudio braucht Zugriff auf deine Fotos, um sie zu bearbeiten."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "FotoStudio speichert bearbeitete Bilder in deiner Fotomediathek."
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
